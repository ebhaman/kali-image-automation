# http/preseed.cfg
# Debian preseed configuration for fully unattended Kali Linux installation.
# Packer serves this file via its built-in HTTP server during the boot sequence.
# The VM fetches it at: http://<packer-host-ip>:<port>/preseed.cfg

# ── Locale ────────────────────────────────────────────────────────────────────
d-i debian-installer/language string en
d-i debian-installer/country string NL
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ── Network ───────────────────────────────────────────────────────────────────
# Use DHCP during install — cloud-init sets the final static IP on first boot
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kali-template
d-i netcfg/get_domain string local
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configure network manually

# ── Mirror ────────────────────────────────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string
d-i mirror/suite string kali-rolling

# ── Clock ─────────────────────────────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Amsterdam
d-i clock-setup/ntp boolean true

# ── Users ─────────────────────────────────────────────────────────────────────
# Root login disabled — kali user gets sudo via sudoers
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Kali Build User
d-i passwd/username string kali
# Password is set from BUILD_SSH_PASS variable injected by Packer boot_command
# During actual provisioning this is overridden; the placeholder below is safe
# because the VM is ephemeral and the password is replaced before template seal
d-i passwd/user-password password BUILD_PASS_PLACEHOLDER
d-i passwd/user-password-again password BUILD_PASS_PLACEHOLDER
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ── Partitioning ──────────────────────────────────────────────────────────────
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true

# ── Package selection ─────────────────────────────────────────────────────────
# Minimal install — provisioner scripts add what is needed
tasksel tasksel/first multiselect standard
d-i pkgsel/include string \
  openssh-server \
  sudo \
  curl \
  wget \
  gnupg \
  ca-certificates \
  apt-transport-https

d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ── Bootloader ────────────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# ── Late command ──────────────────────────────────────────────────────────────
# Run after installation completes but before first reboot.
# Configures SSH and sudo so Packer can connect immediately after boot.
d-i preseed/late_command string \
  in-target sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config ; \
  in-target sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config ; \
  in-target sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config ; \
  in-target bash -c 'echo "kali ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/kali-packer' ; \
  in-target chmod 440 /etc/sudoers.d/kali-packer

# ── Finish ────────────────────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
